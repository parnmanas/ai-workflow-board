apply plugin: 'com.android.application'

android {
    namespace = "com.parnmanas.awb"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.parnmanas.awb"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 디버그 서명(versionCode 1)과 릴리즈 서명은 다르다 — 서명을 바꾸면 기존 설치와
        // 업데이트가 안 맞으므로 릴리즈는 2부터. 기기를 옮길 땐 기존 앱을 지우고 깐다.
        versionCode 2
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // 릴리즈 서명 — Play Protect가 디버그(debuggable) 빌드를 가차 없이 막으므로
    // 배포용은 릴리즈 키로 서명한다. 키스토어가 없는 머신에서는 이 블록이 조용히
    // 건너뛰어지고 assembleRelease는 unsigned 실패(명확함)로 끝난다 — 디버그
    // 흐름(assembleDebug)에는 영향이 없다. 비밀번호는 평문으로 두지 않고
    // 파일(.storepass/.keypass, 키스토어 옆 기본값)에서 읽는다.
    // 주의: 기본 PKCS12 키스토어는 store/key 비밀번호 분리를 지원하지 않아
    // 두 파일에 같은 값을 둔다.
    // 설정: local.properties(깃 제외)의 awb.keystore.* 또는 AWB_KEYSTORE_* 환경변수.
    def awbProps = new Properties()
    def awbPropsFile = rootProject.file('local.properties')
    if (awbPropsFile.exists()) { awbPropsFile.withInputStream { awbProps.load(it) } }
    def ksPath = System.getenv('AWB_KEYSTORE_PATH') ?: awbProps.getProperty('awb.keystore.path', '')
    def ksAlias = System.getenv('AWB_KEYSTORE_ALIAS') ?: awbProps.getProperty('awb.keystore.alias', 'awb')
    def ksStorePassFile = System.getenv('AWB_KEYSTORE_STOREPASS_FILE') ?: awbProps.getProperty('awb.keystore.storepassFile', '')
    def ksKeyPassFile = System.getenv('AWB_KEYSTORE_KEYPASS_FILE') ?: awbProps.getProperty('awb.keystore.keypassFile', '')
    if (!ksStorePassFile && ksPath) ksStorePassFile = new File(new File(ksPath).getParent(), '.storepass').path
    if (!ksKeyPassFile && ksPath) ksKeyPassFile = new File(new File(ksPath).getParent(), '.keypass').path
    if (ksPath && new File(ksPath).exists() && new File(ksStorePassFile).exists() && new File(ksKeyPassFile).exists()) {
        signingConfigs {
            release {
                storeFile file(ksPath)
                storePassword file(ksStorePassFile).text.trim()
                keyAlias ksAlias
                keyPassword file(ksKeyPassFile).text.trim()
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    } else {
        logger.warn('AWB release keystore not configured — assembleRelease will be unsigned. See local.properties (awb.keystore.*).')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
