plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.parnmanas.awb'
    compileSdk = 36

    defaultConfig {
        // Capacitor 껍데기(versionCode 1–3)와 같은 applicationId·같은 릴리즈 키 — 덮어 설치로 업데이트된다.
        applicationId 'com.parnmanas.awb'
        minSdk 26
        targetSdk 36
        // 11: Qwen PCM 스트리밍과 operator 호출 응답. 12: 서버 여러 개(목록 · 전환 · 서버마다 로그인).
        // Source values are floors; automation supplies a monotonically increasing release version.
        versionCode providers.gradleProperty('awbVersionCode').getOrElse('12').toInteger()
        versionName providers.gradleProperty('awbVersionName').getOrElse('2.2.0')
        buildConfigField 'String', 'DEFAULT_SERVER_URL', '"https://awb.parnmanas.com"'
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // 릴리즈 서명 — 키스토어가 없는 머신에서는 조용히 건너뛰고 assembleRelease 는 unsigned 로 끝난다.
    // 설정: local.properties(깃 제외)의 awb.keystore.* 또는 AWB_KEYSTORE_* 환경변수.
    // 비밀번호는 키스토어 옆 .storepass/.keypass 파일에서 읽는다(PKCS12 라 두 값이 같다).
    def awbProps = new Properties()
    def awbPropsFile = rootProject.file('local.properties')
    if (awbPropsFile.exists()) { awbPropsFile.withInputStream { awbProps.load(it) } }
    def ksPath = System.getenv('AWB_KEYSTORE_PATH') ?: awbProps.getProperty('awb.keystore.path', '')
    def ksAlias = System.getenv('AWB_KEYSTORE_ALIAS') ?: awbProps.getProperty('awb.keystore.alias', 'awb')
    def ksStorePassFile = System.getenv('AWB_KEYSTORE_STOREPASS_FILE') ?: awbProps.getProperty('awb.keystore.storepassFile', '')
    def ksKeyPassFile = System.getenv('AWB_KEYSTORE_KEYPASS_FILE') ?: awbProps.getProperty('awb.keystore.keypassFile', '')
    if (!ksStorePassFile && ksPath) ksStorePassFile = new File(new File(ksPath).getParent(), '.storepass').path
    if (!ksKeyPassFile && ksPath) ksKeyPassFile = new File(new File(ksPath).getParent(), '.keypass').path
    if (ksPath && new File(ksPath).exists() && new File(ksStorePassFile).exists() && new File(ksKeyPassFile).exists()) {
        signingConfigs {
            release {
                storeFile file(ksPath)
                storePassword file(ksStorePassFile).text.trim()
                keyAlias ksAlias
                keyPassword file(ksKeyPassFile).text.trim()
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    } else {
        if (providers.gradleProperty('awbRequireSigning').getOrElse('false') == 'true') {
            throw new GradleException('AWB release signing is required but the keystore or password files are missing.')
        }
        logger.warn('AWB release keystore not configured — assembleRelease will be unsigned. See local.properties (awb.keystore.*).')
    }
}

dependencies {
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.browser:browser:1.9.0'
    testImplementation 'junit:junit:4.13.2'
    // 단위 테스트에서는 Android 의 org.json 이 껍데기라 진짜 구현을 넣는다.
    testImplementation 'org.json:json:20240303'
}
