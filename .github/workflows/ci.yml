# CI — Postgres dialect matrix (ticket 0c175408)
#
# Why this exists: dev runs on sql.js (dynamically typed) and prod runs on
# Postgres (strictly typed). Dialect-specific bugs — e.g. the
# `operator does not exist: uuid = character varying` crash in
# chat-rooms searchMessages (ticket ca31a6ea) — pass every local sqlite run and
# only surface AFTER deploy on live Postgres. That made live-only verification a
# recurring structural pattern.
#
# This workflow runs the cross-table / chat-join contract flows against a real
# ephemeral Postgres so that class of bug fails the build BEFORE merge. The
# qa-flows harness (bootApp) already honors DB_TYPE=postgres and, for the
# matrix, isolates each test process in its own pg schema.
#
# The grep guard job is the cheap static backstop (no Postgres needed): it fails
# fast if a chat-rooms query reintroduces a bare `*.room_id = *.room_id`
# column-vs-column join without the ::text cast.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      # production.private 는 **실제로 배포되는 브랜치**인데 여기 없었다(2026-08-20
      # 의존성 감사에서 발견). main 은 PR·push 양쪽으로 게이트되지만, production.private
      # 는 merge 후 직접 push 로 갱신되므로 pull_request 트리거도 걸리지 않는다 — 즉
      # 배포 브랜치에서는 dependency-audit(취약점·install script·액션 SHA 고정)이 단
      # 한 번도 돌지 않았고, 같은 push 에 반응하는 워크플로는 deploy.yml 뿐이었다.
      # 오늘 시점엔 lockfile 이 main 과 동일해 실제 취약점은 0건이지만, production
      # 전용 커밋이 의존성이나 워크플로를 건드리면 감사 없이 그대로 나간다.
      #
      # 무거운 잡까지 여기서 돌릴 이유는 없다: 같은 커밋이 이미 main 에서 전체
      # 매트릭스를 통과했고, deploy.yml 이 동일 push 에 병렬로 배포하므로 CI 가
      # 게이트 역할을 하지도 못한다(배포를 막지 못한다). 그래서 아래 잡들은
      # production.private 에서 스킵하고, `npm ci` 조차 하지 않아 수 초에 끝나는
      # dependency-audit 만 남긴다 — 배포된 트리에 대한 사후 신호로는 충분하다.
      - production.private
  # 정기 재감사 (2026-08-21 의존성 감사에서 발견).
  #
  # 위 트리거는 전부 **이벤트 구동**이다 — push / PR / 수동 dispatch. 그런데
  # `npm audit` 이 잡는 건 "우리 lockfile 이 바뀌었는가" 가 아니라 "이 버전에 대해
  # advisory 가 새로 나왔는가" 다. 그 둘은 독립적이다: 의존성을 한 줄도 안 건드려도
  # 어제까지 깨끗하던 버전에 오늘 CVE 가 붙는다. 이벤트 구동만 있으면 의존성을
  # 건드리는 다음 push 까지 — 실제로 몇 주가 걸린다 — 그 취약점을 아무도 보지 않고,
  # 그 사이 배포는 계속 나간다. 지금까지 이 공백은 사람/에이전트가 생각날 때 돌리는
  # 수동 감사로만 메워졌다(그게 이 항목을 발견한 감사다).
  #
  # 매일 04:17 UTC(13:17 KST) 에 dependency-audit 만 돌려 그 공백을 닫는다. 무거운
  # 잡들은 `github.event_name != 'schedule'` 로 스킵된다 — 같은 커밋이 이미 push 에서
  # 전체 매트릭스를 통과했으므로 매일 다시 태울 이유가 없다(scripts/audit-cron-
  # coverage.mjs 가 이 두 가지를 가드한다).
  #
  # 주의: GitHub 의 schedule 트리거는 **기본 브랜치에서만** 돈다. 즉 cron 은 main 의
  # lockfile 만 본다 — 배포 브랜치 production.private 는 push 때만 감사된다. 그래서
  # dependency-audit 에 schedule 전용 스텝을 하나 더 뒀다(아래 "배포 브랜치 lockfile
  # 재감사"): cron 이 배포 브랜치 lockfile 도 같이 훑는다.
  schedule:
    - cron: '17 4 * * *'

  # use_pr=false 보드에선 feature 브랜치를 push 해도 PR 이 생기지 않아 pull_request
  # 트리거가 걸리지 않는다 — CI(windows 축 포함)가 main 랜딩 전엔 한 번도 돌지 않는
  # 구조적 사각지대가 있었다(ticket 34a6281a, 사례: 61b2ee51). workflow_dispatch 를
  # 추가하면 병합 직전 특정 브랜치(ref)를 지정해 수동으로 전체 매트릭스를 돌릴 수
  # 있다. 수동 dispatch 는 저장소 쓰기 권한이 있는 주체만 트리거할 수 있으므로
  # (GitHub 기본 동작) 신뢰할 수 없는 코드가 자동 실행되는 새 경로는 아니다 — 아래
  # permissions: contents: read 는 트리거 종류와 무관하게 이 워크플로의 모든 잡에
  # 그대로 적용된다.
  workflow_dispatch:

# 최소권한 GITHUB_TOKEN (2026-08-12 의존성 감사에서 발견).
#
# `permissions:` 블록이 없으면 잡의 GITHUB_TOKEN 은 **저장소 기본값**을 물려받는다.
# 기본값이 "read and write" 인 저장소에서는 이 워크플로의 모든 잡이 contents/packages/
# issues 등에 write 가능한 토큰을 들고 돌게 된다. 이 워크플로가 하는 일을 보면 그게
# 왜 위험한지 분명하다 — `npm ci` 로 서드파티 의존성의 install script 를 실행하고
# (허용목록: esbuild/fsevents/@scarf/scarf), PR 브랜치에서 온 전체 테스트 스위트를
# 실행한다. 즉 **신뢰할 수 없는 코드가 write 토큰과 같은 프로세스 트리에 있다.**
# 의존성 하나가 탈취되면 그 install script 가 $GITHUB_TOKEN 으로 main 에 푸시하거나
# 릴리스를 조작할 수 있고, 그건 publish 워크플로를 통해 fleet 전체로 번진다.
#
# 이 워크플로의 어떤 잡도 쓰기를 하지 않는다 — checkout / setup-node / npm ci /
# build / test 뿐이고 secrets 도 참조하지 않는다. 따라서 `contents: read` 하나면
# 충분하고(=checkout 에 필요한 최소), 명시하지 않은 나머지 스코프는 전부 none 으로
# 떨어진다. 저장소 기본값이 나중에 바뀌어도 이 선언이 이겨서 blast radius 가 고정된다.
# (발행 측 publish-agent-manager.yml 은 릴리스 태그 push + provenance 때문에
#  contents:write + id-token:write 가 실제로 필요하며, 이미 명시돼 있다.)
permissions:
  contents: read

jobs:
  # 의존성 보안 게이트 (2026-08-18 감사).
  #
  # 이전까지 취약점 점검은 **수동**이었다 — 사람이 생각날 때 `npm audit` 을 돌리는
  # 방식이라 감사와 감사 사이에 취약한 의존성이 조용히 랜딩할 수 있었다. 실제로
  # react-router 건은 그 공백에서 발견됐다. 이 잡이 그 공백을 닫는다.
  #
  # 여섯 가지를 본다:
  #   1) npm audit — lockfile 대비 advisory. moderate 이상이면 실패시킨다.
  #      (현재 트리는 main/production.private 모두 0건이므로 이 문턱은 새로 들어오는
  #       취약점만 잡는다. `npm audit fix` 는 금지 — 루트 overrides 를 날린다.)
  #   2) install-script 허용목록 — `npm ci` 가 실행하게 될 서드파티 스크립트 집합이
  #      늘어나면 실패. ci.yml 주석에만 있던 허용목록을 실행 가능한 검사로 만든 것.
  #   3) 액션 SHA 고정 (2026-08-19 감사) — `uses:` 가 가변 태그(@v4)면 실패.
  #      업스트림이 태그를 옮기면 우리 워크플로가 조용히 새 코드를 실행하는데,
  #      publish-agent-manager.yml 은 NPM_TOKEN + contents:write 를 들고 돈다.
  #   4) 배포 브랜치 트리거 커버리지 (2026-08-20 감사).
  #   5) 정기 감사 커버리지 (2026-08-21 감사) — `schedule:` 이 살아 있고, cron 이
  #      무거운 잡까지 태우지 않는지. advisory 는 우리 커밋과 무관하게 늘어나므로
  #      이벤트 구동 트리거만으로는 시간축이 비어 있다.
  #   6) 배포 브랜치 lockfile 재감사 (schedule 전용, 2026-08-21 감사) — GitHub cron 은
  #      기본 브랜치에서만 돌아 main 의 lockfile 만 본다. 정작 돌고 있는 트리는
  #      production.private 이므로, cron 때만 그 브랜치 lockfile 도 따로 훑는다.
  #
  # 의도적으로 `npm ci` 를 하지 않는다. 둘 다 package-lock.json 만 읽으면 되고,
  # 설치를 생략하면 "취약점을 찾는 잡이 그 취약점의 install script 를 먼저 실행하는"
  # 순서 문제가 원천적으로 사라진다.
  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: npm audit (moderate 이상 실패)
        run: npm audit --audit-level=moderate
      - name: install-script 허용목록 가드
        run: node scripts/audit-install-scripts.mjs
      - name: 액션 SHA 고정 가드
        run: node scripts/audit-action-pins.mjs
      - name: 배포 브랜치 감사 커버리지 가드
        run: node scripts/audit-ci-branch-coverage.mjs
      - name: 정기 감사 커버리지 가드
        run: node scripts/audit-cron-coverage.mjs
      # 발행 범위 상한 가드 (2026-08-22 감사). 오프라인·수 밀리초라 항상 돈다.
      # 위 모든 검사는 lockfile 축인데, agent-manager 는 호스트에 `npm i -g` 로
      # 깔리고 그 경로는 lockfile 을 읽지 않는다 — npm 이 `^` 범위를 그 시점
      # 레지스트리에서 새로 해석한다. 범위를 넓히는 변경(`^1.7.0` → `*`)은 그
      # 구멍의 폭을 직접 키우므로 cron 을 기다리지 않고 PR 에서 막는다.
      - name: 발행 패키지 선언 범위 가드
        run: node scripts/audit-published-deps.mjs --offline
      # schedule 전용 — cron 은 기본 브랜치(main)에서만 돌므로, 이 스텝이 없으면
      # 배포 브랜치는 "다음 push" 까지 새 advisory 를 한 번도 평가받지 못한다.
      # push/PR 에서는 그 브랜치 자신의 dependency-audit 이 이미 돌므로 불필요.
      - name: 배포 브랜치 lockfile 재감사 (schedule 전용)
        if: github.event_name == 'schedule'
        run: node scripts/audit-deploy-branch-deps.mjs
      # schedule 전용 — 레지스트리를 실제로 때려 "지금 `npm i -g awb-agent-manager`
      # 가 깔 트리"(live)와 "다음 publish 가 넘길 트리"(next)를 해석해 audit 한다.
      # 매 PR 마다 외부 레지스트리에 의존하면 CI 가 비-hermetic 해지고 레지스트리
      # blip 이 곧 red 다. 반면 이 축이 잡는 건 시간축 변화(우리 커밋과 무관하게
      # 늘어나는 advisory + 우리 커밋과 무관하게 움직이는 `^` 해석 결과)이므로
      # 하루 한 번이면 충분하다. 값싼 상한 검사는 위에서 항상 돈다.
      - name: 발행 트리 재감사 (schedule 전용)
        if: github.event_name == 'schedule'
        run: node scripts/audit-published-deps.mjs

  # Fast static guard — runs everywhere, no DB. Catches the bare-join regression
  # class deterministically in seconds.
  chat-join-grep-guard:
    name: chat-rooms join cast guard
    # production.private push 에서는 스킵 — 위 `on:` 주석 참조(동일 커밋이 이미
    # main 에서 통과했고, 이 잡은 `npm ci` 로 서드파티 install script 를 실행한다).
    if: github.ref != 'refs/heads/production.private' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run chat-rooms join cast guard
        working-directory: apps/server
        run: node --test --test-force-exit test/chat-room-join-cast-guard.test.mjs

  # (ticket 433f6cbd) 예전엔 여기 `agent-manager version bump guard` 잡이 있어
  # agent-manager 소스가 바뀐 push/PR 은 package.json version 을 손으로 올리도록
  # 강제하고, 리베이스가 그 범프를 조용히 collapse 시킨 경우(board lesson #1)를
  # 사후 검출했다. 이제 버전을 **publish 시점에 레지스트리+patch 로 자동 계산**하므로
  # (publish-agent-manager.yml + scripts/compute-publish-version.mjs) 손으로 범프할
  # 값 자체가 없다 → collapse 될 것도 없어 이 가드는 목적을 잃었다(오히려 정상
  # 변경마다 CI 를 red 로 만든다). 그래서 잡·check-version-bump.mjs·그 테스트를 제거.

  # agent-manager 테스트 게이트 (ticket e09fa003 — e299c6b3 리뷰 후속).
  #
  # 배경: e299c6b3 전까지 agent-manager 의 node --test 스위트(rebase 시점 535 tests —
  # cli-resolver Windows shim, spawn-failure-tracker, subagent-manager 서킷브레이커/silent-exit 등
  # 이 보드의 반복 버그원 회귀 가드 포함)는 어느 CI 잡에도 안 걸려 있었다. blocker
  # 대응으로 추가된 잡은 spawn-cmd 1개 파일만 돌려 "N tests green" 이 assignee 로컬
  # 실행에만 의존했다(리뷰어는 gh 도 없어 교차검증 불가). 이 잡이 전체 스위트를
  # ubuntu + windows-latest 양 축의 CI 게이트로 편입한다.
  #
  # 양 축 모두 build + 전체 스위트(node --test 'test/*.test.mjs')를 돌린다. 대부분
  # 테스트가 dist/ 를 import 하므로 build step 이 선행돼야 한다(tsc·copyFileSync 모두
  # cross-platform). ubuntu 로컬 검증(origin/main@c52e20b 위 rebase 후): 534 pass /
  # 1 skip / 0 fail, ~13s. (skip = spawn-cmd 의 windows-전용 테스트, Linux self-skip)
  #
  # Windows 이식성: 스위트는 대부분 platform·fs 를 '주입'하는 순수 로직이라 win32 에서
  # 그대로 돈다(cli-resolver `.cmd` shim, service-install 런처 XML, process-tree
  # parseProcListWin 등 — 각 테스트 주석 "실제 Windows 호스트 없이 테스트 가능"). 실제
  # `.cmd` CreateProcess 경로(spawn-cmd)와 codex 심링크(자기-skip)는 win32 축에서 처음
  # 진짜 실행된다(위 e299c6b3 codex `.cmd` ENOENT 회귀 — 주입으로 대체 불가). 실 git
  # 서브프로세스로 POSIX 파일권한(mode & 0o077)·절대경로·credential --file= 경로를
  # 단언하는 3개 테스트만 win32 에서 명시적 skip(repo-credential·run-provisioner·
  # worktree-manager 각 1개; 각 `{ skip: process.platform === 'win32' && '…' }` 주석
  # 참조). git config 격리는 os.devNull 로 이식성 있게 고쳤다(git-mode-update).
  #
  # 참고: `node --test test/`(디렉터리 인자)는 node ≥22 에서 `test` 를 엔트리 모듈로
  # 취급해 MODULE_NOT_FOUND 로 죽는다. 그래서 package.json `test` 스크립트와 동일한
  # glob 형(`'test/*.test.mjs'`)을 쓴다 — node 자체가 확장하므로 shell 무관(Windows
  # PowerShell 에선 작은따옴표 리터럴로 node 에 전달돼 node 가 확장한다).
  agent-manager-tests:
    name: agent-manager tests (${{ matrix.os }})
    # production.private push 에서는 스킵 — 위 `on:` 주석 참조(동일 커밋이 이미
    # main 에서 통과했고, 이 잡은 `npm ci` 로 서드파티 install script 를 실행한다).
    if: github.ref != 'refs/heads/production.private' && github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      AWB_AGENT_MANAGER_HOME: ${{ github.workspace }}/.agent-manager-home
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # 전체 스위트가 dist/ 를 import → build 선행 필수 (양 축 공통).
      - name: Build agent-manager (suite imports dist/)
        working-directory: apps/agent-manager
        run: npm run build
      - name: Run full agent-manager test suite
        working-directory: apps/agent-manager
        run: node --test --test-force-exit 'test/*.test.mjs'
      # windows 축 flake 는 파일 단위로만 실패하고 피해 프로세스의 stdout/stderr 이
      # 비어 있어, 테스트 파일 경계를 넘는 교차 증거가 agent-manager.log 에만 남는다.
      # 기본 경로(러너 홈)에 두면 잡 종료와 함께 사라지므로 위 잡 레벨 env 로 워크스페이스
      # 안에 고정하고 실패 시에만 수거한다. 디렉터리는 logging.ts 최상위 mkdirSync 가 만든다.
      - name: 실패 시 agent-manager 로그 업로드
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-manager-log-${{ matrix.os }}
          path: .agent-manager-home/agent-manager.log*
          if-no-files-found: ignore
          retention-days: 7

  # 클라이언트 단위·상호작용 테스트 (티켓 98d0936e · F2-1). Phase 1 은 브라우저
  # 러너 부재로 카드 클릭·`?ticket=` 딥링크·모바일 패널·포커스트랩이 SSR/순수
  # 계약으로만 커버됐다. 이제 jsdom 하네스(node --import tsx --test)가 실제
  # react-dom/client 마운트로 그 상호작용을 검증하므로 이 잡이 그 스위트를 CI 에서
  # 태운다 — 신규 프레임워크 없이 기존 러너 관례 그대로.
  client-tests:
    name: client unit + interaction tests
    # production.private push 에서는 스킵 — 위 `on:` 주석 참조(동일 커밋이 이미
    # main 에서 통과했고, 이 잡은 `npm ci` 로 서드파티 install script 를 실행한다).
    if: github.ref != 'refs/heads/production.private' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run client tests
        run: npm test -w client

  ontology-graph-browser-smoke:
    name: Ontology Graph browser smoke (SQL.js + Chromium)
    if: github.ref != 'refs/heads/production.private' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build server and run bounded browser smoke
        run: npm run build -w server && npm run test:e2e:ontology -w client

  # apps/server 전체 `npm test` 체이닝 CI 게이트 (ticket 003fcc99).
  #
  # 배경: apps/server/package.json 의 `test` 스크립트(build 선행 + top-level ~92개
  # 파일 + `test:qa` e2e ~91개 파일 + 마지막 1개, 총 168개 파일)를 실행하는 CI 잡이
  # 하나도 없었다. 아래 `postgres-dialect-matrix` 는 `test:qa:pg`(test:qa 의 11개
  # 파일 부분집합)만 Postgres 로 돌리므로, 나머지 top-level 가드와 `test:qa` 전체는
  # CI 어디에서도 실행되지 않아 로컬 실행 결과에만 의존하는 사각지대였다 — 실제로
  # `base-repo-binding.test.mjs` 정적 가드가 clean main 에서도 red 였던 회귀가 이
  # 갭 때문에 한동안 아무 CI 도 잡지 못했다(ticket 9ab1bae1 로 테스트만 별도 수정).
  #
  # 이 잡은 그 전체 체인을 sqlite(sql.js, 기본 다이얼렉트)로 CI 게이트에 편입한다.
  # `npm test` 자체가 build 를 선행하므로 별도 build step 은 불필요.
  server-tests:
    name: apps/server full test suite (sqlite)
    # production.private push 에서는 스킵 — 위 `on:` 주석 참조(동일 커밋이 이미
    # main 에서 통과했고, 이 잡은 `npm ci` 로 서드파티 install script 를 실행한다).
    if: github.ref != 'refs/heads/production.private' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run apps/server full test suite (build + top-level + qa-flows)
        working-directory: apps/server
        run: npm test

  # Dialect matrix — the actual pre-deploy safety net. Boots the contract flows
  # against Postgres 16 (matching the prod image) so uuid/varchar mismatches and
  # other Postgres-only failures are caught here, not on the live server.
  postgres-dialect-matrix:
    name: qa-flows on Postgres
    # production.private push 에서는 스킵 — 위 `on:` 주석 참조(동일 커밋이 이미
    # main 에서 통과했고, 이 잡은 `npm ci` 로 서드파티 install script 를 실행한다).
    if: github.ref != 'refs/heads/production.private' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: awb
          POSTGRES_PASSWORD: awb
          POSTGRES_DB: awb_ci
        ports:
          - 5432:5432
        # Wait until pg accepts connections before the job's steps run.
        options: >-
          --health-cmd "pg_isready -U awb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_TYPE: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: awb
      DB_PASS: awb
      DB_NAME: awb_ci
      NODE_ENV: test
      MCP_DEV_MODE: 'true'
      AGENT_DEV_MODE: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build server
        run: npm run build -w server
      - name: Run qa-flows dialect matrix on Postgres
        working-directory: apps/server
        run: npm run test:qa:pg
